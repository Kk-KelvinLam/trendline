[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trendline"
version = "0.1.0"
description = "Post-US-close next-day S&P 500 high/low/close forecast dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "pyarrow>=14",
  "lightgbm>=4.0",
  "yfinance>=0.2",
  "requests>=2.31",
  "streamlit>=1.32",
  "streamlit-keyup>=0.2.0",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
