name: Nightly cards

on:
  schedule:
    # After the US cash close, once Yahoo/Stooq usually have the bar.
    - cron: "0 23 * * 1-5"
    # Weekly full walk-forward (Sunday 10:00 UTC).
    - cron: "0 10 * * 0"
  workflow_dispatch:
    inputs:
      retrain:
        description: "Full walk-forward retrain"
        type: boolean
        default: false

concurrency:
  group: nightly-cards
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout dashboard branch
        uses: actions/checkout@v4
        with:
          ref: feat/v1-dashboard

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Fetch and refresh
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          RETRAIN=false
          if [ "${{ github.event.inputs.retrain }}" = "true" ]; then
            RETRAIN=true
          fi
          if [ "${{ github.event.schedule }}" = "0 10 * * 0" ]; then
            RETRAIN=true
          fi
          if [ "$RETRAIN" = "true" ]; then
            python scripts/nightly.py --retrain
          else
            python scripts/nightly.py
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/artifacts/cards.json data/artifacts/metrics.json data/artifacts/per_ticker.json data/artifacts/models
          if git diff --cached --quiet; then
            echo "no card/model changes"
            exit 0
          fi
          git commit -m "chore: nightly cards $(date -u +%F)"
          git push origin feat/v1-dashboard
