name: Nightly cards

on:
  schedule:
    # After the US cash close + Yahoo Close settle (12:15 HKT Tue–Sat = 04:15 UTC).
    # Mon–Fri US sessions land the next HKT calendar morning/afternoon.
    - cron: "15 4 * * 2-6"
    # Weekly full three-family walk-forward (Sunday 19:15 HKT / 11:15 UTC).
    - cron: "15 11 * * 0"
  workflow_dispatch:
    inputs:
      retrain:
        description: "Full three-family walk-forward retrain"
        type: boolean
        default: false

concurrency:
  group: nightly-cards
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout dashboard branch
        uses: actions/checkout@v4
        with:
          ref: feat/nightJob

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Fetch and refresh
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          RETRAIN=false
          if [ "${{ github.event.inputs.retrain }}" = "true" ]; then
            RETRAIN=true
          fi
          if [ "${{ github.event.schedule }}" = "15 11 * * 0" ]; then
            RETRAIN=true
          fi
          if [ "$RETRAIN" = "true" ]; then
            python scripts/nightly.py --retrain
          else
            python scripts/nightly.py
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/artifacts/cards.json \
            data/artifacts/cards_shared.json \
            data/artifacts/cards_sector.json \
            data/artifacts/cards_stock.json \
            data/artifacts/metrics.json \
            data/artifacts/scoreboard.json \
            data/artifacts/per_ticker.json \
            data/artifacts/per_ticker_shared.json \
            data/artifacts/per_ticker_sector.json \
            data/artifacts/per_ticker_stock.json \
            data/artifacts/models \
            data/universe/sp500.csv \
            data/artifacts/ledger.json
          # One ohlcv.parquet in the working tree; commit it only after a monthly full pull
          # so git history does not grow ~11MB per weekday.
          if [ -f data/artifacts/.commit_ohlcv ]; then
            git add data/parquet/ohlcv.parquet
            rm -f data/artifacts/.commit_ohlcv
          fi
          if git diff --cached --quiet; then
            echo "no card/model changes"
            exit 0
          fi
          git commit -m "chore: nightly cards $(date -u +%F)"
          git push origin feat/v1-dashboard
